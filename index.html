    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

      const u = URL.createObjectURL(pageBlob);

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      }

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

    // consumers read these Blobs directly. Survives the swap like the error sink.

      ';</' + 'script>';

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lamp(28px,4vh,40px);transition:transform .2s\" sc-camel-on-mouse-over=\"{{ btnOver }}\" sc-camel-on-mouse-out=\"{{ btnOut }}\">Consultar por el programa <span style=\"font-size:16px;line-height:0\">→<\u002Fspan><\u002Fa>\n    <\u002Farticle>\n\n    <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:16px;margin:clamp(48px,7vh,80px) 0 clamp(24px,3vh,36px)\">\n      <h3 style=\"margin:0;font-size:clamp(22px,2.4vw,34px);font-weight:800;letter-spacing:-.01em\">Contenidos de formación<\u002Fh3>\n      <span style=\"font-size:13px;color:#6b655d\">7 módulos en aula · práctica formativa en empresa<\u002Fspan>\n    <\u002Fdiv>\n    <div data-g=\"cards4\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.5vw,20px)\">\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">01<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Integración y encuadre dual<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Roles y responsabilidades de la modalidad dual, cultura de trabajo, seguridad personal y acuerdos de convivencia.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">02<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Sector cárnico y punto de venta<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Cadena cárnica y rol del eslabón comercial, calidad comercial y nociones de trazabilidad y registro por lotes.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">03<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Inocuidad, higiene y manipulación<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Buenas prácticas de higiene, prevención de contaminación cruzada y control de temperaturas, tiempos y almacenamiento.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">04<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Técnicas iniciales y herramientas<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Identificación de cortes y porcionado, uso seguro de cuchillos y chaira, afilado, ergonomía y control visual de calidad.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">05<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Elaboraciones y valor agregado<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Preparaciones simples bajo receta estándar, control de rotación, rotulado interno e higiene de equipos y superficies.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">06<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Punto de venta y atención al cliente<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Exhibición en vitrina, reposición, FIFO/FEFO, comunicación con clientes y presentación del puesto.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#E7E3DC;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:13px;font-weight:800;color:#741D22\">07<\u002Fspan><\u002Fdiv><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Competencias transversales<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:#4a463f\">Trabajo en equipo, comunicación, responsabilidad y pensamiento crítico aplicado al control del proceso.<\u002Fp><\u002Farticle>\n      <article data-reveal=\"\" data-course=\"\" style=\"background:#741D22;color:#F5F3EF;padding:clamp(20px,2vw,28px);display:flex;flex-direction:column;justify-content:space-between;transition:transform .3s\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:rgba(245,243,239,.75)\">En empresa<\u002Fspan><\u002Fdiv><div><h4 style=\"margin:16px 0 0;font-size:16.5px;line-height:1.2;font-weight:800;letter-spacing:-.01em\">Práctica formativa<\u002Fh4><p style=\"margin:12px 0 0;font-size:13.5px;line-height:1.55;color:rgba(245,243,239,.82)\">Recepción, preparación, exhibición y venta con progresión de observación a autonomía y evaluación conjunta.<\u002Fp><\u002Fdiv><\u002Farticle>\n    <\u002Fdiv>\n    <!-- ediciones anteriores -->\n    <div data-reveal=\"\" style=\"margin-top:clamp(56px,8vh,90px)\">\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:clamp(20px,3vh,32px)\">\n        <h3 style=\"margin:0;font-size:clamp(22px,2.4vw,34px);font-weight:800;letter-spacing:-.01em\">Ediciones anteriores<\u002Fh3>\n        <span style=\"font-size:13px;color:#6b655d\">Tocá una edición para ampliar<\u002Fspan>\n      <\u002Fdiv>\n      <div data-g=\"cards4\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.5vw,20px)\">\n        <button sc-camel-on-click=\"{{ openThumb }}\" data-src=\"assets/flyer-aprendiz.png\" style=\"all:unset;cursor:zoom-in;display:block;position:relative;aspect-ratio:3/4;background:#1c130d;overflow:hidden\"><svg sc-camel-view-box=\"0 0 300 400\" sc-camel-preserve-aspect-ratio=\"xMidYMid slice\" style=\"position:absolute;inset:0;width:100%;height:100%\"><circle cx=\"150\" cy=\"170\" r=\"70\" fill=\"none\" stroke=\"#741D22\" stroke-width=\"1.5\" opacity=\".8\"><\u002Fcircle><line x1=\"0\" y1=\"60\" x2=\"300\" y2=\"340\" stroke=\"#F5F3EF\" stroke-width=\"1\" opacity=\".25\"><\u002Fline><\u002Fsvg><span style=\"position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(28,19,13,.85));color:#F5F3EF;font-size:11px;letter-spacing:.5px;padding:22px 12px 12px;font-weight:600\">Aprendiz de Carnicería<\u002Fspan><\u002Fbutton>\n        <div style=\"position:relative;aspect-ratio:3/4;background:#F0ECE4;border:1px dashed rgba(24,24,24,.22);display:flex;align-items:center;justify-content:center;text-align:center\"><span style=\"font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a847a;max-width:16ch;line-height:1.5\">Espacio para próximas ediciones<\u002Fspan><\u002Fdiv>\n        <div style=\"position:relative;aspect-ratio:3/4;background:#F0ECE4;border:1px dashed rgba(24,24,24,.22);display:flex;align-items:center;justify-content:center;text-align:center\"><span style=\"font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a847a;max-width:16ch;line-height:1.5\">Espacio para próximas ediciones<\u002Fspan><\u002Fdiv>\n        <div style=\"position:relative;aspect-ratio:3/4;background:#F0ECE4;border:1px dashed rgba(24,24,24,.22);display:flex;align-items:center;justify-content:center;text-align:center\"><span style=\"font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8a847a;max-width:16ch;line-height:1.5\">Espacio para próximas ediciones<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- METODOLOGÍA -->\n<section id=\"metodologia\" style=\"background:#1c130d;color:#F5F3EF;padding:clamp(80px,12vh,150px) clamp(20px,5vw,64px)\">\n  <div style=\"max-width:1360px;margin:0 auto\">\n    <div data-reveal=\"\" style=\"max-width:60ch;margin-bottom:clamp(48px,7vh,90px)\">\n      <span style=\"font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#B23B33;font-weight:700\">03 — Metodología<\u002Fspan>\n      <h2 style=\"margin:20px 0 0;font-size:clamp(36px,5.5vw,84px);line-height:.98;font-weight:800;letter-spacing:-.02em\">Aprender haciendo.<\u002Fh2>\n      <p style=\"margin:26px 0 0;font-size:17px;line-height:1.65;color:rgba(245,243,239,.72)\">Formación dual que alterna aula y empresa. Cada concepto se demuestra, se practica en el puesto real y se corrige con retroalimentación constante — del «ver hacer» al «hacer con autonomía».<\u002Fp>\n    <\u002Fdiv>\n    <div data-g=\"three\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,3vw,56px)\">\n      <div data-reveal=\"\" style=\"border-top:2px solid #741D22;padding-top:26px\">\n        <div style=\"font-size:clamp(64px,8vw,124px);font-weight:800;line-height:.85;letter-spacing:-.03em;color:rgba(245,243,239,.14)\">01<\u002Fdiv>\n        <h3 style=\"margin:18px 0 0;font-size:24px;font-weight:700\">Conocimiento<\u002Fh3>\n        <p style=\"margin:14px 0 0;font-size:15px;line-height:1.65;color:rgba(245,243,239,.7);max-width:34ch\">Comprender los productos, herramientas, procesos y fundamentos del oficio.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"border-top:2px solid #741D22;padding-top:26px\">\n        <div style=\"font-size:clamp(64px,8vw,124px);font-weight:800;line-height:.85;letter-spacing:-.03em;color:rgba(245,243,239,.14)\">02<\u002Fdiv>\n        <h3 style=\"margin:18px 0 0;font-size:24px;font-weight:700\">Técnica<\u002Fh3>\n        <p style=\"margin:14px 0 0;font-size:15px;line-height:1.65;color:rgba(245,243,239,.7);max-width:34ch\">Aprender procedimientos y desarrollar precisión en cada etapa del trabajo.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"border-top:2px solid #741D22;padding-top:26px\">\n        <div style=\"font-size:clamp(64px,8vw,124px);font-weight:800;line-height:.85;letter-spacing:-.03em;color:rgba(245,243,239,.14)\">03<\u002Fdiv>\n        <h3 style=\"margin:18px 0 0;font-size:24px;font-weight:700\">Práctica<\u002Fh3>\n        <p style=\"margin:14px 0 0;font-size:15px;line-height:1.65;color:rgba(245,243,239,.7);max-width:34ch\">Aplicar lo aprendido en situaciones reales acompañados por profesionales.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- alternancia -->\n    <div data-reveal=\"\" style=\"margin-top:clamp(56px,8vh,96px)\">\n      <div style=\"font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:rgba(245,243,239,.5);font-weight:600;margin-bottom:24px\">Alternancia aula–empresa · 6 meses<\u002Fdiv>\n      <div data-g=\"three\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,32px)\">\n        <div style=\"border-top:1px solid rgba(245,243,239,.25);padding-top:20px\"><div style=\"font-size:13px;font-weight:700;color:#B23B33\">Mes 1<\u002Fdiv><div style=\"font-size:17px;font-weight:700;margin-top:8px\">Integración e inducción<\u002Fdiv><p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:rgba(245,243,239,.65)\">Higiene, inocuidad y seguridad. Observación y familiarización en el puesto de trabajo.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid rgba(245,243,239,.25);padding-top:20px\"><div style=\"font-size:13px;font-weight:700;color:#B23B33\">Meses 2–5<\u002Fdiv><div style=\"font-size:17px;font-weight:700;margin-top:8px\">Práctica supervisada<\u002Fdiv><p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:rgba(245,243,239,.65)\">Técnicas, elaboraciones, vitrina y atención al cliente. Evaluación de desempeño intermedia.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid rgba(245,243,239,.25);padding-top:20px\"><div style=\"font-size:13px;font-weight:700;color:#B23B33\">Mes 6<\u002Fdiv><div style=\"font-size:17px;font-weight:700;margin-top:8px\">Autonomía e inserción<\u002Fdiv><p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:rgba(245,243,239,.65)\">Autonomía progresiva, evaluación final conjunta y plan de inserción laboral.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROFESIONALIZACIÓN -->\n<section style=\"padding:clamp(80px,12vh,150px) clamp(20px,5vw,64px)\">\n  <div data-g=\"two\" style=\"max-width:1360px;margin:0 auto;display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(28px,5vw,90px);align-items:center\">\n    <div data-reveal=\"\">\n      <span style=\"font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#741D22;font-weight:700\">04 — Profesionalización<\u002Fspan>\n      <h2 style=\"margin:22px 0 0;font-size:clamp(34px,4.6vw,68px);line-height:1.0;font-weight:800;letter-spacing:-.02em;max-width:13ch;text-wrap:balance\">Un oficio que también se estudia.<\u002Fh2>\n      <div style=\"width:56px;height:2px;background:#741D22;margin:34px 0\"><\u002Fdiv>\n      <p style=\"margin:0 0 22px;font-size:17px;line-height:1.7;color:#3a3733;max-width:52ch\">La industria cárnica evoluciona constantemente. Nuevas técnicas, procesos, herramientas y estándares requieren profesionales cada vez más capacitados.<\u002Fp>\n      <p style=\"margin:0;font-size:17px;line-height:1.7;color:#3a3733;max-width:52ch\">En CPCU buscamos acompañar esa transformación a través de formación especializada.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"position:relative;aspect-ratio:4/5;background:#E7E3DC;overflow:hidden\">\n      <svg sc-camel-view-box=\"0 0 320 400\" sc-camel-preserve-aspect-ratio=\"xMidYMid slice\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n        <g stroke=\"#1c130d\" stroke-width=\"1\" opacity=\".18\"><line x1=\"0\" y1=\"50\" x2=\"320\" y2=\"50\"><\u002Fline><line x1=\"0\" y1=\"120\" x2=\"320\" y2=\"120\"><\u002Fline><line x1=\"0\" y1=\"190\" x2=\"320\" y2=\"190\"><\u002Fline><line x1=\"0\" y1=\"260\" x2=\"320\" y2=\"260\"><\u002Fline><line x1=\"0\" y1=\"330\" x2=\"320\" y2=\"330\"><\u002Fline><\u002Fg>\n        <line x1=\"60\" y1=\"380\" x2=\"260\" y2=\"30\" stroke=\"#741D22\" stroke-width=\"1.5\" opacity=\".7\"><\u002Fline>\n        <circle cx=\"200\" cy=\"200\" r=\"54\" fill=\"none\" stroke=\"#741D22\" stroke-width=\"1\" opacity=\".45\"><\u002Fcircle>\n      <\u002Fsvg>\n      <span style=\"position:absolute;left:16px;bottom:14px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6b655d;font-family:ui-monospace,Menlo,monospace\">Imagen · herramientas + enseñanza<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- DIRIGIDO A -->\n<section style=\"padding:0 clamp(20px,5vw,64px) clamp(80px,1 ); const im=lb&&lb.querySelector(\"[data-lightbox-img]\"); if(im&&src) im.src=src; if(lb) lb.style.display=\"flex\"; },\n      closeLb:()=>{ const lb=document.querySelector(\"[data-lightbox]\"); if(lb) lb.style.display=\"none\"; },\n      btnOver:(e)=>{ e.currentTarget.style.transform=\"translateY(-2px)\"; e.currentTarget.style.filter=\"brightness(1.08)\"; },\n      btnOut:(e)=>{ e.currentTarget.style.transform=\"none\"; e.currentTarget.style.filter=\"none\"; },\n      ghostOver:(e)=>{ e.currentTarget.style.background=\"rgba(245,243,239,.08)\"; e.currentTarget.style.borderColor=\"rgba(245,243,239,.7)\"; },\n      ghostOut:(e)=>{ e.currentTarget.style.background=\"transparent\"; e.currentTarget.style.borderColor=\"rgba(245,243,239,.35)\"; },\n      darkOver:(e)=>{ e.currentTarget.style.background=\"#741D22\"; },\n      darkOut:(e)=>{ e.currentTarget.style.background=\"#1c130d\"; },\n      fldFocus:(e)=>{ e.currentTarget.style.borderBottomColor=\"#741D22\"; },\n      fldBlur:(e)=>{ e.currentTarget.style.borderBottomColor=\"rgba(24,24,24,.28)\"; },\n      formEndpoint: \"https://formspree.io/f/mrpzlpqo\",\n      onSubmit:(e)=>{ e.preventDefault(); const f=e.currentTarget; const ep=this.renderVals().formEndpoint; this.setState({submitLabel:\"Enviando…\"}); fetch(ep,{ method:\"POST\", body:new FormData(f), headers:{Accept:\"application/json\"} }).then(r=>{ if(r.ok){ f.reset(); this.setState({submitLabel:\"¡Gracias! Te contactamos\"}); } else { this.setState({submitLabel:\"Error, probá de nuevo\"}); } }).catch(()=>this.setState({submitLabel:\"Error, probá de nuevo\"})).finally(()=>{ setTimeout(()=>this.setState({submitLabel:\"Enviar consulta\"}),3600); }); },\n      toggleMenu:()=>{ const hd=document.querySelector(\"[data-hd]\"); if(!hd) return; const open=hd.getAttribute(\"data-open\")!==\"true\"; hd.setAttribute(\"data-open\", open?\"true\":\"false\"); },\n    };\n  }\n\n  componentDidMount(){\n    // sticky header transparent -> solid\n    const hd = document.querySelector(\"[data-hd]\");\n    const setSolid = (solid)=>{\n      if(!hd) return;\n      hd.style.background = solid ? \"#F5F3EF\" : \"transparent\";\n      hd.style.borderBottomColor = solid ? \"rgba(24,24,24,.12)\" : \"transparent\";\n      hd.style.padding = solid ? \"14px clamp(20px,5vw,64px)\" : \"22px clamp(20px,5vw,64px)\";\n      hd.style.boxShadow = solid ? \"0 1px 0 rgba(0,0,0,.02)\" : \"none\";\n      const logo = hd.querySelector(\"[data-hd-logo]\");\n      if(logo) logo.style.filter = \"none\";\n      hd.querySelectorAll(\"[data-hd-link]\").forEach(l=>{ l.style.color = \"#1c1a19\"; });\n      hd.querySelectorAll(\"[data-burger-line]\").forEach(b=>{ b.style.background = \"#1c1a19\"; });\n    };\n    this._onScroll = ()=> setSolid(window.scrollY > 40);\n    window.addEventListener(\"scroll\", this._onScroll, {passive:true});\n    this._onScroll();\n    if(hd){ hd.setAttribute(\"data-open\",\"false\"); hd.querySelectorAll(\"[data-hd-nav] a\").forEach(a=> a.addEventListener(\"click\", ()=> hd.setAttribute(\"data-open\",\"false\"))); }\n\n    // reveal on scroll\n    const els = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    const revealOn = this.props.revealOnScroll ?? true;\n    if(!revealOn || !(\"IntersectionObserver\" in window)){\n      els.forEach(el=>{ el.style.opacity=\"1\"; el.style.transform=\"none\"; });\n      return;\n    }\n    els.forEach((el,i)=>{\n      el.style.opacity=\"0\";\n      el.style.transform=\"translateY(22px)\";\n      el.style.transition=\"opacity .7s cubic-bezier(.2,.6,.2,1), transform .7s cubic-bezier(.2,.6,.2,1)\";\n    });\n    this._io = new IntersectionObserver((entries)=>{\n      entries.forEach(en=>{\n        if(en.isIntersecting){ en.target.style.opacity=\"1\"; en.target.style.transform=\"none\"; this._io.unobserve(en.target); }\n      });\n    }, {threshold:.12, rootMargin:\"0px 0px -8% 0px\"});\n    els.forEach(el=> this._io.observe(el));\n  }\n\n  componentWillUnmount(){\n    if(this._onScroll) window.removeEventListener(\"scroll\", this._onScroll);\n    if(this._io) this._io.disconnect();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
